<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bếp Nhà · Quản lý bếp ăn</title><style>
:root{color-scheme:dark;--bg:#17232e;--panel:#243442;--line:#ffffff19;--muted:#b7c5d1;--yellow:#ffcb15;--purple:#ad91ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#40345c 0,transparent 45%),radial-gradient(ellipse at 0 65%,#1a454d,transparent 50%),var(--bg);background-attachment:fixed;color:#f6f7f9;font:15px/1.5 system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#ffffff0b;color:inherit;border-radius:13px;padding:11px 15px;min-height:44px}button:hover{background:#ffffff18}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--yellow);color:#17212d;font-weight:750;border:0}button.purple{background:#7560ad;color:white}input,select,textarea{width:100%;background:#17232e;color:#fff;border:1px solid #ffffff29;border-radius:12px;padding:12px;min-height:44px}textarea{min-height:140px;resize:vertical}label{display:block;margin:12px 0 5px;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:29px;letter-spacing:-1px}h2{font-size:19px}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.shell{max-width:1100px;margin:auto;padding:30px 28px 130px}.top,.row,.between{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.top{margin-bottom:25px}.logo{background:var(--yellow);color:#17212d;width:45px;height:45px;display:grid;place-items:center;border-radius:16px;font-size:25px}.badge{padding:5px 10px;border-radius:30px;background:#ffffff0c;font-size:12px;white-space:nowrap}.green{color:#80e1b7}.yellow{color:var(--yellow)}.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#ffffff09,#ffffff02),#243442d9;backdrop-filter:blur(14px);padding:22px;margin-top:17px;box-shadow:0 12px 35px #0000000c}.hero{background:#f1f4f8;color:#17212d}.hero .muted,.hero small{color:#53616d}.money{font-size:38px;letter-spacing:-1.5px;font-weight:750;margin:7px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.stat{border-top:1px solid #7e899533;padding-top:13px}.stat strong{display:block;font-size:18px}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}.meal{margin-top:12px;border:1px solid var(--line);background:#ffffff06;border-radius:17px;padding:16px}.meal p{margin-top:8px;color:#d5dfe8;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chips .active{background:var(--yellow);color:#17212d;font-weight:700}.person{padding:13px 0;border-bottom:1px solid var(--line)}.person:last-child{border:0}.ticks{display:flex;gap:6px;margin-top:9px}.tick{flex:1;padding:8px}.tick.on{background:#79d5b31c;color:#a1efce;border-color:#80dfb44d}.tick.off{color:#ffa99b;background:#ff8a7b0c}.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;background:#192734f0;backdrop-filter:blur(25px);border:1px solid #ffffff26;border-radius:23px;padding:7px;z-index:10;box-shadow:0 10px 40px #0006}.nav button{flex:1;border:0;background:none;font-size:12px;padding:8px 3px}.nav b{display:block;font-size:20px;margin-bottom:3px}.nav .active{background:#ffcb1518;color:var(--yellow)}.ai{position:fixed;bottom:103px;right:max(18px,calc((100vw - 1100px)/2));border-radius:50%;background:#7954d2;box-shadow:0 5px 25px #51369a88;width:58px;height:58px;font-weight:800;z-index:11}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.grid2 .card{margin:0}.wide{overflow:auto}table{border-collapse:collapse;min-width:100%;font-size:13px}th,td{padding:10px;border:1px solid var(--line);text-align:center;white-space:nowrap}th{background:#263747}.cut{color:#ffac96}.sheet{border:1px solid #ffffff30;border-radius:25px;background:#20303e;color:#fff;padding:25px;width:min(620px,calc(100% - 20px));max-height:90dvh;overflow:auto}.sheet::backdrop{background:#061019bb;backdrop-filter:blur(5px)}.sheet .close{float:right}.sheet h2{padding:8px 0 15px}.sheet .primary{margin-top:18px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#f5f7fa;color:#17212d;border-radius:14px;padding:12px 20px;z-index:100;box-shadow:0 10px 40px #0005;max-width:92%;display:none}.note{white-space:pre-wrap}.chatlog{max-height:330px;overflow:auto}.bubble{padding:12px 15px;background:#ffffff09;border-radius:15px;margin:10px 0}.bubble.user{background:#7658bb55;margin-left:30px}.dayinput{max-width:165px}.empty{text-align:center;padding:25px;color:var(--muted)}.sectiontitle{margin-top:23px}.danger{color:#ffad9e}.hint{padding:10px 13px;background:#ffffff06;border-radius:12px;margin-top:12px;font-size:13px;color:var(--muted)}@media(max-width:750px){.shell{padding:20px 16px 130px}.layout{display:block}.card{padding:18px}.top{margin-bottom:20px}h1{font-size:25px}.money{font-size:33px}.stats{gap:8px}.stat strong{font-size:16px}.grid2{gap:10px}.grid2 .card{padding:15px}.badge{font-size:11px}.hide-mobile{display:none}}
</style><body><div class="shell"><header class="top"><div class="logo">♨</div><div><strong>BẾP NHÀ</strong><div class="muted" style="font-size:12px">Một ngày gọn gàng, một bữa ngon.</div></div><span class="badge yellow" style="margin-left:auto">Bản tương tác</span></header><main id="app"></main></div><nav class="nav" id="nav"></nav><button class="ai" onclick="chat()" aria-label="Mở trợ lý AI">✦ AI</button><dialog class="sheet" id="modal"></dialog><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const KEY='bep-nha-demo-v1', names=['Hôm nay','Tài chính','Ghi chú','Cài đặt'], icons=['◷','▤','✎','⚙'], groups=['Cán bộ','Chiến sĩ','Khách'];
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Math.round(n).toLocaleString('vi-VN')+'₫';
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function shift(d,n){let t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)}function dateLabel(d){return d.split('-').reverse().join('/')}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
let state,tab=0,date=today(),month=date.slice(0,7),group='Cán bộ',filter='all',search='',storageOK=true;
const breakfast=[['Cơm tẻ','Thịt bằm sốt cà','Canh bầu'],['Cơm tẻ','Trứng đúc thịt','Canh bí'],['Cơm tẻ','Thịt xào dưa','Canh rau cải']],weekend=[['Bánh cuốn'],['Xôi thịt'],['Bún măng xương'],['Bánh mì']],lunch=[['Cơm tẻ','Tôm rang lá chanh','Đậu phụ rim','Thịt gà sáo','Rau cải xào','Canh rau cải','Tráng miệng'],['Cơm tẻ','Thịt gà chiên mắm','Cá cơm rang','Tai mui trộn','Giá đỗ xào','Canh mồng tơi','Tráng miệng'],['Cơm tẻ','Cá chiên','Trứng luộc','Thịt bò xào hành cần','Rau muống luộc','Canh rau muống','Tráng miệng']],dinner=[['Cơm tẻ','Thịt lợn rang','Lạc rim mắm','Chả ram','Bắp cải luộc','Canh bắp cải'],['Cơm tẻ','Cá kho','Thịt vịt rang','Đậu phụ nhồi thịt','Rau lang xào','Canh bí thịt băm'],['Cơm tẻ','Thịt gà rang','Lươn um chuối','Trứng tráng','Bí xanh xào','Canh rau ngót']];
function menuFor(d){let i=new Date(d+'T12:00:00').getDate(),week=new Date(d+'T12:00:00').getDay();return [(week===0||week===6?weekend:breakfast)[i%(week===0||week===6?4:3)].join(', '),lunch[i%3].join(', '),dinner[i%3].join(', ')]}
function fresh(){let people=[['Minh Anh','Cán bộ'],['Quốc Huy','Cán bộ'],['Hoàng Nam','Chiến sĩ'],['Tuấn Minh','Chiến sĩ'],['Gia Bảo','Chiến sĩ'],['Khách An','Khách']].map(([name,group],i)=>({id:'p'+i,name,group,active:true}));return {version:1,people,days:{},notes:[{id:'n1',text:'Kiểm tra số suất ngày mai trước khi đặt thực phẩm.',pinned:true}],logs:[],transactions:[],rates:[{from:'2000-01-01',rice:700}],prices:[14400,28800,28800],fees:[2400,4800,4800]}}
try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh();storageOK=false}
function day(d){if(!state.days[d])state.days[d]={closed:false,meals:Object.fromEntries(state.people.filter(p=>p.active&&p.group!=='Khách').map(p=>[p.id,[true,true,true]])),menu:menuFor(d),purchases:[],snapshot:null};return state.days[d]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageOK=false;toast('Trình duyệt chưa cho lưu. Hãy xuất bản sao lưu.')}}function log(t){state.logs.unshift({at:new Date().toLocaleString('vi-VN'),text:t});persist()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',3400)}function closeModal(){$('modal').close()}function modal(title,body){$('modal').innerHTML=`<button class="close" onclick="closeModal()" aria-label="Đóng">✕</button><h2>${title}</h2>${body}`;$('modal').showModal()}function riceRate(d){return [...state.rates].sort((a,b)=>b.from.localeCompare(a.from)).find(r=>r.from<=d)?.rice||0}
function calc(d){let v=day(d);if(v.closed)return v.snapshot;let counts=[0,0,0],cost=0,rice=0,byPerson={};for(let p of state.people){let m=v.meals[p.id]||[false,false,false];let total=m.reduce((s,on,i)=>s+(on?state.prices[i]:0),0);m.forEach((on,i)=>{if(on){counts[i]++;cost+=state.prices[i]-state.fees[i];if(p.group==='Chiến sĩ')rice+=[.136,.272,.272][i]*riceRate(d)}});byPerson[p.id]={counts:m.map(Number),total,group:p.group,name:p.name}}
return {counts,cost,rice,byPerson,total:Object.values(byPerson).reduce((s,p)=>s+p.total,0),spent:v.purchases.reduce((s,p)=>s+p.amount,0)}}
function render(){day(date);$('nav').innerHTML=names.map((n,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()"><b>${icons[i]}</b>${n}</button>`).join('');$('app').innerHTML=[renderToday,renderFinance,renderNotes,renderSettings][tab]();persist()}
function renderToday(){let v=day(date),c=calc(date),tomorrow=shift(date,1),m=day(tomorrow);return `<div class="between"><div><small>KHÔNG GIAN BẾP CỦA BẠN</small><h1>Hôm nay</h1></div><input aria-label="Ngày đang xem" class="dayinput" type="date" value="${date}" onchange="date=this.value||today();render()"></div><div class="layout"><section><div class="card hero"><div class="between"><strong>Ngân sách đi chợ</strong><span class="badge">${v.closed?'✓ Đã chốt':'◷ Dự kiến'}</span></div><div class="money">${money(c.cost)}</div><div class="muted">${c.counts.reduce((a,b)=>a+b,0)} suất · 3 bữa trong ngày</div><div class="stats"><div class="stat"><small>Đã mua</small><strong>${money(c.spent)}</strong></div><div class="stat"><small>Chênh lệch</small><strong>${money(c.cost-c.spent)}</strong></div><div class="stat"><small>Bù gạo</small><strong>Cuối tháng</strong></div></div><div class="actions"><button class="primary" onclick="purchase()" ${v.closed?'disabled':''}>＋ Ghi tiền mua</button><button style="color:#17212d;border-color:#17212d33" onclick="purchases()">Chi tiết</button></div></div><div class="card" id="menuCard"><div class="between"><div><small>ĂN NGON MỖI NGÀY</small><h2>Thực đơn</h2></div><button onclick="editMenu()">✎ Chỉnh sửa</button></div>${[...v.menu,m.menu[0]].map((text,i)=>`<div class="meal"><h3>${['🌅 Bữa sáng','☀️ Bữa trưa','🌙 Bữa tối','🌅 Bữa sáng'][i]} · ${dateLabel(i===3?tomorrow:date)} ${i===3?'<span class="badge yellow">Ngày mai</span>':''}</h3><p>${esc(text)||'Chưa có thực đơn'}</p></div>`).join('')}<div class="actions"><button onclick="exportMenu('copy')">▣ Sao chép ảnh</button><button onclick="exportMenu('share')">↗ Chia sẻ</button><button onclick="exportMenu('download')">↓ PNG</button></div></div></section><section><div class="card"><div class="between"><h2>Chấm cơm</h2><span class="badge green">Mặc định có ăn</span></div><p class="muted">Chạm vào bữa để cắt hoặc đăng ký lại.</p><div class="stats">${c.counts.map((n,i)=>`<div class="stat"><small>${['Sáng','Trưa','Tối'][i]}</small><strong>${n} suất</strong></div>`).join('')}</div>${groups.map(g=>`<div class="sectiontitle"><strong>${g}</strong></div>${state.people.filter(p=>p.group===g&&v.meals[p.id]).map(p=>`<div class="person"><div class="between"><span>${esc(p.name)}</span><button ${v.closed?'disabled':''} onclick="cutAll('${p.id}')" style="padding:5px 9px;font-size:12px">Cắt cả ngày</button></div><div class="ticks">${v.meals[p.id].map((on,i)=>`<button ${v.closed?'disabled':''} class="tick ${on?'on':'off'}" onclick="toggleMeal('${p.id}',${i})">${on?'✓':'−'} ${['Sáng','Trưa','Tối'][i]}</button>`).join('')}</div></div>`).join('')}`).join('')}<div class="actions"><button onclick="guest()" ${v.closed?'disabled':''}>＋ Thêm khách</button><button onclick="cutSchedule()">Lịch cắt cơm</button></div></div><div class="card"><h2>${v.closed?'Ngày đã hoàn tất':'Chốt ngày, an tâm ngày mai'}</h2><p class="muted" style="margin:8px 0">${v.closed?'Số liệu đã được tổng hợp vào Tài chính.':'Kiểm tra ba bữa và tiền mua trước khi tổng hợp.'}</p>${v.closed?`<div class="actions"><button onclick="reopen()">Điều chỉnh ngày</button><button class="primary" onclick="date=shift(date,1);render()">Chuẩn bị ngày mai →</button></div>`:`<button class="primary" style="width:100%" onclick="closeDay()">Chốt sổ và chuẩn bị ngày mai →</button>`}</div></section></div>`}
function toggleMeal(id,i){if(day(date).closed)return;day(date).meals[id][i]=!day(date).meals[id][i];log('Đổi bữa '+['sáng','trưa','tối'][i]+' · '+date);render()}function cutAll(id){if(day(date).closed)return;day(date).meals[id]=[false,false,false];log('Cắt cả ngày '+date);render()}
function purchase(){modal('Ghi tiền mua',`<form onsubmit="savePurchase(event)"><label>Diễn giải</label><input id="purchaseText" required placeholder="Ví dụ: Rau, thịt và cá"><label>Số tiền (đồng)</label><input id="purchaseAmount" type="number" min="1" step="1" required><button class="primary">Lưu khoản mua</button></form>`)}function savePurchase(e){e.preventDefault();if(day(date).closed)return;day(date).purchases.push({id:uid(),text:$('purchaseText').value,amount:Number($('purchaseAmount').value)});log('Ghi tiền mua '+date);closeModal();render();toast('Đã lưu khoản mua')}
function purchases(){modal('Các khoản mua',day(date).purchases.map(p=>`<div class="person between"><div>${esc(p.text)}<br><strong>${money(p.amount)}</strong></div>${day(date).closed?'':`<button onclick="removePurchase('${p.id}')">Xóa</button>`}</div>`).join('')||'<p class="empty">Chưa có khoản mua.</p>')}function removePurchase(id){if(day(date).closed)return;day(date).purchases=day(date).purchases.filter(p=>p.id!==id);persist();closeModal();render();purchases()}
function guest(){modal('Thêm khách ăn',`<form onsubmit="saveGuest(event)"><label>Tên khách</label><input id="guestName" required list="guests"><datalist id="guests">${state.people.filter(p=>p.group==='Khách').map(p=>`<option>${esc(p.name)}</option>`).join('')}</datalist><label>Các bữa đăng ký</label>${['Sáng','Trưa','Tối'].map((x,i)=>`<label><input style="width:auto;min-height:0" type="checkbox" id="gm${i}" checked> ${x}</label>`).join('')}<p class="hint">Khách được ghi nhận thu sau.</p><button class="primary">Thêm vào ngày ${dateLabel(date)}</button></form>`)}function saveGuest(e){e.preventDefault();let n=$('guestName').value.trim(),m=[0,1,2].map(i=>$('gm'+i).checked);if(!n||!m.some(Boolean))return toast('Nhập tên và chọn ít nhất một bữa');let p=state.people.find(p=>p.name===n&&p.group==='Khách');if(!p){p={id:uid(),name:n,group:'Khách',active:true};state.people.push(p)}day(date).meals[p.id]=m;log('Thêm khách '+n);closeModal();render()}
function closeDay(){let c=calc(date);modal('Xác nhận chốt ngày',`<p>${dateLabel(date)} · ${c.counts.join(' / ')} suất sáng / trưa / tối</p><div class="hint">Tiền ăn ${money(c.total)}<br>Đã mua ${money(c.spent)}<br>Bù giá gạo ${money(c.rice)}</div><button class="primary" onclick="commitDay()">Xác nhận chốt và mở ngày mai</button>`)}function commitDay(){let v=day(date);if(v.closed)return;v.snapshot=JSON.parse(JSON.stringify(calc(date)));v.closed=true;log('Chốt sổ '+date);date=shift(date,1);closeModal();render();toast('Đã chốt sổ. Đang chuẩn bị ngày tiếp theo.')}
function reopen(){modal('Điều chỉnh ngày đã chốt',`<form onsubmit="event.preventDefault();day(date).closed=false;day(date).snapshot=null;log('Mở điều chỉnh '+date+': '+document.getElementById('reason').value);closeModal();render()"><p class="muted">Ngày này tạm rút khỏi tổng hợp cho đến khi chốt lại.</p><label>Lý do điều chỉnh</label><input id="reason" required><button class="primary">Mở điều chỉnh</button></form>`)}
function cutSchedule(){modal('Cắt cơm theo lịch',`<form onsubmit="saveCut(event)"><label>Người ăn</label><select id="cutPerson">${state.people.filter(p=>p.group!=='Khách').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="grid2"><div><label>Từ ngày</label><input type="date" id="cutFrom" value="${date}" required></div><div><label>Đến hết ngày</label><input type="date" id="cutTo" value="${date}" required></div></div>${['Sáng','Trưa','Tối'].map((x,i)=>`<label><input style="width:auto;min-height:0" type="checkbox" id="cm${i}" checked> ${x}</label>`).join('')}<button class="primary">Áp dụng lịch</button></form>`)}function saveCut(e){e.preventDefault();let a=$('cutFrom').value,b=$('cutTo').value,id=$('cutPerson').value,ms=[0,1,2].map(i=>$('cm'+i).checked);if(a>b||!ms.some(Boolean))return toast('Kiểm tra khoảng ngày và bữa');if((new Date(b)-new Date(a))/86400000>366)return toast('Chọn tối đa 366 ngày');for(let d=a;d<=b;d=shift(d,1))if(day(d).closed)return toast('Có ngày đã chốt. Hãy điều chỉnh ngày đó trước.');for(let d=a;d<=b;d=shift(d,1)){day(d).meals[id]??=[true,true,true];ms.forEach((on,i)=>{if(on)day(d).meals[id][i]=false})}log('Cắt cơm '+a+' đến '+b);closeModal();render()}
function editMenu(){let vals=[...day(date).menu,day(shift(date,1)).menu[0]];modal('Chỉnh sửa thực đơn',`<p class="muted">Chọn các bữa cần tạo lại bằng Magic Menu.</p>${vals.map((t,i)=>`<label><input style="width:auto;min-height:0" type="checkbox" id="selectMenu${i}" ${i===3||!day(date).closed?'checked':'disabled'}> ${['Sáng','Trưa','Tối','Sáng ngày mai'][i]}</label><textarea id="menu${i}" ${i<3&&day(date).closed?'disabled':''}>${esc(t)}</textarea>`).join('')}<div class="actions"><button class="purple" onclick="magicMenu()">✦ Magic Menu</button><button class="primary" onclick="saveMenu()">Áp dụng</button></div><div class="hint">Magic Menu ghép bữa từ mẫu thực đơn đã gửi, hoạt động offline.</div>`)}function magicMenu(){[0,1,2,3].forEach(i=>{if(!$('selectMenu'+i).checked||$('menu'+i).disabled)return;let d=i===3?shift(date,1):date,wd=new Date(d+'T12:00:00').getDay(),pool=i===1?lunch:i===2?dinner:(wd===0||wd===6?weekend:breakfast),current=$('menu'+i).value,choices=pool.map(x=>x.join(', ')).filter(x=>x!==current);$('menu'+i).value=choices[Math.floor(Math.random()*choices.length)]||pool[0].join(', ')});toast('Đã tạo gợi ý. Bấm Áp dụng để lưu.')}
function saveMenu(){for(let i=0;i<4;i++)if(!$('menu'+i).value.trim())return toast('Vui lòng điền đủ các bữa');if(!day(date).closed)day(date).menu=[0,1,2].map(i=>$('menu'+i).value.trim());let next=day(shift(date,1));if(next.closed)return toast('Ngày tiếp theo đã chốt, cần mở điều chỉnh trước');next.menu[0]=$('menu3').value.trim();log('Cập nhật thực đơn '+date);closeModal();render()}
function monthData(){let entries=Object.entries(state.days).filter(([d,v])=>d.startsWith(month)&&v.closed);return {entries,total:entries.reduce((s,[d,v])=>s+v.snapshot.total,0),spent:entries.reduce((s,[d,v])=>s+v.snapshot.spent,0),rice:entries.reduce((s,[d,v])=>s+v.snapshot.rice,0)}}function personTotals(p){let entries=monthData().entries,counts=[0,0,0],total=0,cut=0;for(let [d,v]of entries){let x=v.snapshot.byPerson[p.id];if(x){counts=counts.map((n,i)=>n+x.counts[i]);total+=x.total;if(p.group!=='Khách'||v.meals[p.id])cut+=3-x.counts.reduce((a,b)=>a+b,0)}}let paid=state.transactions.filter(t=>t.month===month&&t.person===p.id).reduce((s,t)=>s+t.amount,0);return {counts,total,paid,cut}}
function renderFinance(){let c=monthData(),paid=state.transactions.filter(t=>t.month===month&&t.type==='meal').reduce((s,t)=>s+t.amount,0),ricePaid=state.transactions.filter(t=>t.month===month&&t.type==='rice').reduce((s,t)=>s+t.amount,0);let people=state.people.filter(p=>p.group===group).filter(p=>{let t=personTotals(p);return filter==='all'||filter==='cut'&&t.cut>0||filter==='debt'&&t.total>t.paid||filter==='surplus'&&t.paid>t.total});return `<div class="between"><h1>Tài chính</h1><input class="dayinput" type="month" value="${month}" onchange="month=this.value||today().slice(0,7);render()"></div><p class="muted" style="margin:8px 0 20px">${c.entries.length} ngày đã chốt · Tổng hợp chính thức</p><div class="grid2"><div class="card hero"><small>Tiền ăn phát sinh</small><h2>${money(c.total)}</h2><small>Đã thu ${money(paid)}</small></div><div class="card"><small>Tiền mua thực tế · Ngày đã chốt</small><h2>${money(c.spent)}</h2><small>Đối chiếu theo sổ ngày</small></div></div><div class="card"><div class="between"><div><small>CHỈ CHIẾN SĨ</small><h2>Bù giá gạo</h2></div><span class="badge yellow">Quyết toán cuối tháng</span></div><div class="money">${money(c.rice)}</div><p class="muted">Đã nhận ${money(ricePaid)} · Còn chờ ${money(Math.max(0,Math.round(c.rice)-ricePaid))}</p><button style="margin-top:12px" onclick="receiveRice()">＋ Ghi nhận tiền cấp</button></div><div class="card"><div class="between"><h2>Sổ chấm cơm</h2><button onclick="exportCSV()">↓ CSV</button></div><div class="chips">${groups.map(g=>`<button class="${group===g?'active':''}" onclick="group='${g}';render()">${g}</button>`).join('')}</div><select aria-label="Lọc sổ" onchange="filter=this.value;render()">${[['all','Tất cả'],['cut','Có cắt cơm'],['debt','Còn thiếu'],['surplus','Có tiền dư']].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select>${people.map(p=>{let t=personTotals(p);return `<div class="person"><div class="between"><strong>${esc(p.name)}</strong><button onclick="personSheet('${p.id}')">Xem sổ →</button></div><p class="muted">Sáng ${t.counts[0]} · Trưa ${t.counts[1]} · Tối ${t.counts[2]}</p><div class="between"><span>Tiền ăn ${money(t.total)}</span><span class="${t.paid<t.total?'yellow':'green'}">${t.paid<t.total?'Thiếu':'Dư'} ${money(Math.abs(t.total-t.paid))}</span></div><small>Đã nộp ${money(t.paid)} · ${t.cut} bữa không đăng ký</small></div>`}).join('')||'<p class="empty">Chưa có người phù hợp bộ lọc.</p>'}<div class="actions"><button class="primary" onclick="payment()">＋ Thu tiền</button><button onclick="groupPayment()">Thu nhóm chiến sĩ</button><button onclick="groupTable()">Bảng cả nhóm</button></div></div><div class="card"><h2>Giao dịch trong kỳ</h2>${state.transactions.filter(t=>t.month===month).map(t=>`<div class="person between"><span>${esc(t.text)}</span><strong>${money(t.amount)}</strong></div>`).join('')||'<p class="empty">Chưa ghi nhận giao dịch.</p>'}</div>`}
function payment(){modal('Ghi thu tiền ăn',`<form onsubmit="savePayment(event)"><label>Người nộp</label><select id="payPerson">${state.people.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.group}</option>`).join('')}</select><label>Số tiền · Kỳ ${month}</label><input id="payAmount" type="number" min="1" step="1" required><button class="primary">Xác nhận đã nhận tiền</button></form>`)}function savePayment(e){e.preventDefault();let id=$('payPerson').value,p=state.people.find(p=>p.id===id);state.transactions.push({id:uid(),month,type:'meal',person:id,amount:+$('payAmount').value,text:'Thu tiền · '+p.name});log('Thu tiền ăn '+p.name);closeModal();render()}
function groupPayment(){modal('Thu nhóm chiến sĩ',`<form onsubmit="previewGroup(event)"><p class="muted">Phân bổ đều cho các chiến sĩ đang hoạt động.</p><label>Tổng tiền nhận</label><input id="groupAmount" type="number" min="1" step="1" required><button class="primary">Xem phân bổ</button></form>`)}let pendingGroup;function previewGroup(e){e.preventDefault();let ps=state.people.filter(p=>p.active&&p.group==='Chiến sĩ'),n=+$('groupAmount').value;if(!ps.length)return toast('Chưa có chiến sĩ');pendingGroup=ps.map((p,i)=>({p,amount:Math.floor(n/ps.length)+(i<n%ps.length?1:0)}));modal('Xác nhận thu nhóm',pendingGroup.map(x=>`<div class="person between"><span>${esc(x.p.name)}</span><b>${money(x.amount)}</b></div>`).join('')+`<button class="primary" onclick="commitGroup()">Đã nhận ${money(n)}</button>`)}function commitGroup(){if(!pendingGroup)return;for(let x of pendingGroup)state.transactions.push({id:uid(),month,type:'meal',person:x.p.id,amount:x.amount,text:'Thu nhóm · '+x.p.name});pendingGroup=null;log('Thu nhóm chiến sĩ '+month);closeModal();render()}
function receiveRice(){modal('Nhận tiền bù giá gạo',`<form onsubmit="event.preventDefault();state.transactions.push({id:uid(),month,type:'rice',amount:+document.getElementById('riceAmount').value,text:'Nhận cấp bù giá gạo'});log('Nhận bù giá gạo');closeModal();render()"><label>Số tiền thực nhận</label><input id="riceAmount" type="number" min="1" step="1" required><button class="primary">Xác nhận đã nhận</button></form>`)}
function personSheet(id){let p=state.people.find(p=>p.id===id),t=personTotals(p),days=new Date(+month.slice(0,4),+month.slice(5),0).getDate();modal(esc(p.name),`<p class="muted">${month} · Dấu ◌ là ngày chưa chốt</p><div class="wide"><table><tr><th>Ngày</th><th>Sáng</th><th>Trưa</th><th>Tối</th><th>Sổ</th></tr>${Array.from({length:days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0'),v=state.days[d];return `<tr><td>${i+1}</td>${[0,1,2].map(j=>`<td>${v?.meals[id]?.[j]?'✓':v?.meals[id]?'−':'·'}</td>`).join('')}<td>${v?.closed?'Đã chốt':'◌'}</td></tr>`}).join('')}</table></div><div class="hint">Tiền ăn ${money(t.total)} · Đã nộp ${money(t.paid)}</div>${t.paid>t.total?`<button onclick="refund('${id}')" style="margin-top:12px">Hoàn tiền dư</button><button onclick="carry('${id}')">Cấn sang tháng sau</button>`:''}`)}function refund(id){let t=personTotals(state.people.find(p=>p.id===id)),amount=t.paid-t.total;if(amount<=0)return; if(!confirm('Xác nhận đã trả '+money(amount)+'? Số dư dựa trên các ngày đã chốt.'))return;state.transactions.push({id:uid(),month,type:'meal',person:id,amount:-amount,text:'Hoàn tiền dư'});log('Hoàn tiền '+money(amount));closeModal();render()}function carry(id){let t=personTotals(state.people.find(p=>p.id===id)),amount=t.paid-t.total;if(amount<=0)return;if(!confirm('Cấn '+money(amount)+' sang tháng sau theo số liệu đã chốt?'))return;let next=shift(month+'-28',4).slice(0,7);state.transactions.push({id:uid(),month,type:'carry',person:id,amount:-amount,text:'Cấn dư sang '+next},{id:uid(),month:next,type:'carry',person:id,amount,text:'Dư chuyển từ '+month});log('Cấn trừ số dư');closeModal();render()}
function groupTable(){let days=new Date(+month.slice(0,4),+month.slice(5),0).getDate();modal('Bảng chấm cơm · '+group,`<p class="muted">S/T/T · ✓ ăn, − cắt, · chưa có; * chưa chốt</p><div class="wide"><table><tr><th>Họ tên</th>${Array.from({length:days},(_,i)=>`<th>${i+1}</th>`).join('')}</tr>${state.people.filter(p=>p.group===group).map(p=>`<tr><th>${esc(p.name)}</th>${Array.from({length:days},(_,i)=>{let v=state.days[month+'-'+String(i+1).padStart(2,'0')];return `<td>${v?.meals[p.id]?.map(x=>x?'✓':'−').join(' ')||'·'}${v&&!v.closed?' *':''}</td>`}).join('')}</tr>`).join('')}</table></div>`)}
function renderNotes(){return `<div class="between"><h1>Ghi chú</h1><button class="primary" onclick="editNote()">＋ Thêm</button></div><input style="margin-top:18px" placeholder="Tìm ghi chú" aria-label="Tìm ghi chú" value="${esc(search)}" oninput="search=this.value;document.getElementById('noteList').innerHTML=notesList()"><div id="noteList">${notesList()}</div><div class="card"><h2>Lịch sử hoạt động</h2>${state.logs.slice(0,30).map(l=>`<div class="person"><small>${esc(l.at)}</small><div>${esc(l.text)}</div></div>`).join('')||'<p class="empty">Các thay đổi sẽ xuất hiện ở đây.</p>'}</div>`}function notesList(){return [...state.notes].sort((a,b)=>b.pinned-a.pinned).filter(n=>n.text.toLowerCase().includes(search.toLowerCase())).map(n=>`<div class="card"><div class="between"><span class="badge">${n.pinned?'📌 Đã ghim':'Ghi chú'}</span><button onclick="editNote('${n.id}')">✎</button></div><p class="note" style="margin-top:12px">${esc(n.text)}</p><div class="actions"><button onclick="pinNote('${n.id}')">${n.pinned?'Bỏ ghim':'Ghim'}</button><button class="danger" onclick="deleteNote('${n.id}')">Xóa</button></div></div>`).join('')||'<p class="empty">Chưa có ghi chú phù hợp.</p>'}function editNote(id){let n=state.notes.find(n=>n.id===id);modal('Ghi chú',`<form onsubmit="saveNote(event,'${id||''}')"><textarea id="noteText" required>${esc(n?.text||'')}</textarea><button class="primary">Lưu ghi chú</button></form>`)}function saveNote(e,id){e.preventDefault();let t=$('noteText').value.trim();if(!t)return;let n=state.notes.find(n=>n.id===id);if(n)n.text=t;else state.notes.push({id:uid(),text:t,pinned:false});persist();closeModal();render()}function pinNote(id){let n=state.notes.find(n=>n.id===id);n.pinned=!n.pinned;render()}function deleteNote(id){if(confirm('Xóa ghi chú này?')){state.notes=state.notes.filter(n=>n.id!==id);render()}}
function renderSettings(){return `<h1>Cài đặt</h1><p class="muted">Dữ liệu trên trình duyệt của thiết bị này</p><div class="card"><div class="between"><h2>Người ăn</h2><button onclick="addPerson()">＋ Thêm người</button></div>${state.people.map(p=>`<div class="person between"><div><strong>${esc(p.name)}</strong><p class="muted">${p.group}</p></div><button onclick="togglePerson('${p.id}')">${p.active?'Đang hoạt động':'Đã ngừng'}</button></div>`).join('')}<p class="hint">Thay đổi trạng thái áp dụng cho ngày được tạo tiếp theo. Ngày đã tạo cần chỉnh trực tiếp.</p></div><div class="card"><h2>Định mức và phí theo suất</h2><form onsubmit="saveSettings(event)">${['Sáng','Trưa','Tối'].map((x,i)=>`<label>${x} · Định mức / Tổng phí gạo, gia vị, chất đốt</label><div class="grid2"><input aria-label="Định mức ${x}" type="number" min="0" step="1" id="price${i}" value="${state.prices[i]}" required><input aria-label="Phí ${x}" type="number" min="0" step="1" id="fee${i}" value="${state.fees[i]}" required></div>`).join('')}<button class="primary" style="margin-top:15px">Lưu định mức</button></form><p class="hint">Áp dụng cho ngày nháp. Ngày đã chốt giữ số liệu đã lưu.</p></div><div class="card"><h2>Bù giá gạo</h2><p class="muted">Sáng 0,136 kg · Trưa/Tối 0,272 kg</p>${state.rates.map(r=>`<div class="person between"><span>Từ ${dateLabel(r.from)}</span><strong>${money(r.rice)}/kg</strong></div>`).join('')}<button onclick="addRate()" style="margin-top:12px">＋ Mức áp dụng mới</button></div><div class="card"><h2>Dữ liệu và bản thử</h2><p class="hint">Dữ liệu mẫu · Lưu ${storageOK?'tự động bằng localStorage':'tạm thời, cần sao lưu'} · AI mô phỏng. Magic Menu dùng bộ bữa mẫu offline.</p><div class="actions"><button onclick="backup()">↓ Sao lưu JSON</button><button onclick="document.getElementById('restore').click()">↑ Khôi phục</button><button class="danger" onclick="reset()">Đặt lại bản thử</button></div><input hidden type="file" accept=".json" id="restore" onchange="restoreData(this.files[0])"></div>`}
function addPerson(){modal('Thêm người ăn',`<form onsubmit="savePerson(event)"><label>Họ tên</label><input id="personName" required><label>Nhóm</label><select id="personGroup">${groups.map(g=>`<option>${g}</option>`).join('')}</select><button class="primary">Thêm người</button></form>`)}function savePerson(e){e.preventDefault();let name=$('personName').value.trim();if(!name)return;let p={id:uid(),name,group:$('personGroup').value,active:true};state.people.push(p);if(p.group!=='Khách'&&!day(date).closed)day(date).meals[p.id]=[true,true,true];log('Thêm người '+name);closeModal();render()}function togglePerson(id){let p=state.people.find(p=>p.id===id);p.active=!p.active;log('Đổi trạng thái '+p.name);render()}function saveSettings(e){e.preventDefault();let prices=[0,1,2].map(i=>+$('price'+i).value),fees=[0,1,2].map(i=>+$('fee'+i).value);if(fees.some((v,i)=>v>prices[i]))return toast('Phí không được lớn hơn định mức');state.prices=prices;state.fees=fees;log('Đổi định mức');render();toast('Đã lưu định mức')}
function addRate(){modal('Mức bù giá gạo mới',`<form onsubmit="event.preventDefault();let d=document.getElementById('rateDate').value;state.rates=state.rates.filter(r=>r.from!==d);state.rates.push({from:d,rice:+document.getElementById('rateValue').value});log('Đổi mức bù gạo từ '+d);closeModal();render()"><label>Ngày bắt đầu</label><input id="rateDate" type="date" value="${date}" required><label>Đồng/kg</label><input id="rateValue" type="number" min="0" step="1" required><button class="primary">Lưu mức mới</button></form>`)}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}function backup(){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'bep-nha-sao-luu.json')}async function restoreData(file){if(!file)return;try{let s=JSON.parse(await file.text());if(s.version!==1||!Array.isArray(s.people)||!s.days||!Array.isArray(s.transactions)||!Array.isArray(s.notes)||!Array.isArray(s.logs)||!Array.isArray(s.rates)||s.prices?.length!==3||s.fees?.length!==3)throw Error();if(!confirm('Thay dữ liệu hiện tại bằng bản sao lưu?'))return;state=s;persist();render();toast('Đã khôi phục')}catch{toast('File sao lưu không hợp lệ')}}function reset(){if(confirm('Xóa dữ liệu thử hiện tại và tạo lại dữ liệu mẫu?')){state=fresh();date=today();render()}}function exportCSV(){let rows=[['Họ tên','Nhóm','Sáng','Trưa','Tối','Tiền ăn','Đã nộp','Dư/Thiếu'],...state.people.map(p=>{let t=personTotals(p);return [p.name,p.group,...t.counts,t.total,t.paid,t.paid-t.total]})];download(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'so-cham-com-'+month+'.csv')}
function menuCanvas(){let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1000;let meals=[...day(date).menu,day(shift(date,1)).menu[0]],blocks=[];ctx.font='28px Arial';function wrap(t){let lines=[],line='';for(let word of t.split(/\s+/)){let next=line?line+' '+word:word;if(ctx.measureText(next).width>830&&line){lines.push(line);line=word}else line=next}if(line)lines.push(line);return lines}meals.forEach((text,i)=>blocks.push({title:['BỮA SÁNG','BỮA TRƯA','BỮA TỐI','BỮA SÁNG'][i]+' · '+dateLabel(i===3?shift(date,1):date),lines:wrap(text)}));canvas.height=155+blocks.reduce((s,b)=>s+100+b.lines.length*43,0);ctx.fillStyle='#f6f7f9';ctx.fillRect(0,0,1000,canvas.height);ctx.fillStyle='#17212d';ctx.font='bold 38px Arial';ctx.fillText('THỰC ĐƠN BẾP ĂN',50,68);let y=110;for(let b of blocks){let h=80+b.lines.length*43;ctx.fillStyle='#e8edf3';ctx.beginPath();ctx.roundRect(30,y,940,h,22);ctx.fill();ctx.fillStyle='#17212d';ctx.font='bold 29px Arial';ctx.fillText(b.title,60,y+45);ctx.font='28px Arial';b.lines.forEach((l,j)=>ctx.fillText(l,60,y+90+j*43));y+=h+20}return canvas}
async function exportMenu(mode){try{let canvas=menuCanvas(),blobPromise=new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(mode==='copy'&&navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':blobPromise})]);return toast('Đã sao chép ảnh thực đơn')}let blob=await blobPromise;if(mode==='share'){let file=new File([blob],'thuc-don-'+date+'.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Thực đơn'});return}}download(blob,'thuc-don-'+date+'.png');toast(mode==='download'?'Đã xuất ảnh thực đơn':'Trình duyệt chưa hỗ trợ. Đã tải ảnh PNG để gửi.')}catch(e){if(e.name==='AbortError')return;let blob=await new Promise(r=>menuCanvas().toBlob(r));download(blob,'thuc-don-'+date+'.png');toast('Chưa được cấp quyền sao chép. Đã tải ảnh PNG.')}}
let messages=[{text:'Xin chào! Đây là AI mô phỏng. Tôi có thể xem ngân sách, mở thực đơn hoặc giúp bạn ghi chú.',user:false}];function chat(){modal('✦ Trợ lý bếp · Mô phỏng',`<div class="chatlog" id="chatLog">${messages.map(m=>`<div class="bubble ${m.user?'user':''}">${esc(m.text)}</div>`).join('')}</div><div class="chips"><button onclick="sendChat('Ngân sách hôm nay')">Ngân sách</button><button onclick="closeModal();tab=0;render();editMenu()">Sửa thực đơn</button><button onclick="closeModal();tab=2;render();editNote()">Ghi chú</button></div><form onsubmit="event.preventDefault();sendChat(document.getElementById('chatInput').value)"><input id="chatInput" placeholder="Hỏi về số suất hoặc ngân sách…" required><button class="primary">Gửi</button></form>`)}function sendChat(t){if(!t.trim())return;messages.push({text:t,user:true});let c=calc(date),s=t.toLowerCase(),reply=s.includes('ngân')||s.includes('tiền')?`Ngày ${dateLabel(date)} có ngân sách đi chợ ${money(c.cost)}, đã mua ${money(c.spent)}. ${day(date).closed?'Sổ đã chốt.':'Đây là số liệu dự kiến.'}`:s.includes('suất')?`Sáng ${c.counts[0]}, trưa ${c.counts[1]}, tối ${c.counts[2]} suất.`:'Bản thử đang mô phỏng hội thoại. Bạn có thể dùng các nút phía dưới để sửa thực đơn hoặc thêm ghi chú; Gemini thật sẽ được tích hợp trong app Kotlin.';messages.push({text:reply,user:false});closeModal();chat();$('chatLog').scrollTop=$('chatLog').scrollHeight}
render();
